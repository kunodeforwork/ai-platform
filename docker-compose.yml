services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: chint
      POSTGRES_PASSWORD: chint-local-password
      POSTGRES_DB: chint_ai
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chint -d chint_ai"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
